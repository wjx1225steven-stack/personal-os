<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PERSONAL OS — 简洁、私密的个人成长管理系统">
  <meta name="theme-color" content="#f4f5f2">
  <title>PERSONAL OS · 人生升级计划</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
          <strong>PERSONAL OS</strong>
          <span>人生升级计划</span>
        </div>
        <button class="icon-button sidebar-close" id="sidebarClose" aria-label="关闭导航">×</button>
      </div>

      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-view="home">
          <span class="nav-icon" aria-hidden="true">⌂</span><span>今日概览</span>
        </button>
        <p class="nav-label">成长系统</p>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="openDataPanel">
          <span class="nav-icon" aria-hidden="true">⇅</span><span>数据管理</span>
        </button>
        <p>数据仅保存在此浏览器</p>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-controls="sidebar" aria-expanded="false" aria-label="打开导航">☰</button>
        <div>
          <p class="eyebrow" id="pageEyebrow">今天，继续向前</p>
          <h1 id="pageTitle">今日概览</h1>
        </div>
        <div class="topbar-actions">
          <button class="button button-secondary desktop-data-button" id="topDataButton">数据管理</button>
          <button class="button button-primary" id="addTaskButton"><span>＋</span> 新建任务</button>
        </div>
      </header>

      <div class="content" id="appContent">
        <p id="storageNotice" role="alert" hidden></p>
        <section id="homeView">
          <div class="hero-card">
            <div class="hero-copy">
              <span class="status-pill"><i></i> 本地运行 · 数据私密</span>
              <h2 id="greeting">早上好，今天想推进什么？</h2>
              <p>专注少数重要的事，让每一次完成都推动系统向前。</p>
            </div>
            <div class="progress-ring" id="progressRing" style="--progress: 0" aria-label="今日完成率 0%">
              <div><strong id="ringValue">0%</strong><span>今日完成</span></div>
            </div>
          </div>

          <section class="stats-grid" aria-label="今日数据">
            <article class="stat-card">
              <div class="stat-icon indigo" aria-hidden="true">今</div>
              <div><span>今日任务</span><strong id="todayCount">0</strong><small id="todayHint">等待规划</small></div>
            </article>
            <article class="stat-card">
              <div class="stat-icon green" aria-hidden="true">✓</div>
              <div><span>已完成</span><strong id="completedCount">0</strong><small id="completedHint">保持节奏</small></div>
            </article>
            <article class="stat-card">
              <div class="stat-icon amber" aria-hidden="true">%</div>
              <div><span>完成率</span><strong id="completionRate">0%</strong><small>今日进度</small></div>
            </article>
          </section>

          <section class="section-block">
            <div class="section-heading">
              <div><p class="eyebrow">FOCUS</p><h2>今日任务</h2></div>
              <button class="text-button" id="showAllToday">查看全部</button>
            </div>
            <div class="task-list" id="todayTaskList"></div>
          </section>

          <section class="section-block system-overview">
            <div class="section-heading">
              <div><p class="eyebrow">SYSTEMS</p><h2>六大成长系统</h2></div>
            </div>
            <div class="module-grid" id="moduleGrid"></div>
          </section>
        </section>

        <section id="moduleView" class="module-view" hidden>
          <div class="module-summary" id="moduleSummary"></div>
          <div class="toolbar">
            <div class="filter-group" id="filterGroup" aria-label="任务筛选">
              <button class="filter-button active" data-filter="all">全部</button>
              <button class="filter-button" data-filter="active">进行中</button>
              <button class="filter-button" data-filter="completed">已完成</button>
            </div>
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="taskSearch" type="search" placeholder="搜索任务" aria-label="搜索任务">
            </label>
          </div>
          <div class="task-list" id="moduleTaskList"></div>
        </section>
      </div>
    </main>
  </div>

  <dialog class="modal" id="taskModal">
    <form class="modal-card" id="taskForm" method="dialog">
      <div class="modal-header">
        <div><p class="eyebrow">TASK</p><h2 id="taskModalTitle">新建任务</h2></div>
        <button class="icon-button modal-close" type="button" data-close-modal="taskModal" aria-label="关闭">×</button>
      </div>
      <input type="hidden" id="taskId">
      <label class="field">
        <span>任务名称 <b>*</b></span>
        <input id="taskTitle" type="text" maxlength="80" placeholder="例如：阅读 30 分钟" required autofocus>
      </label>
      <label class="field">
        <span>所属系统</span>
        <select id="taskModule" required></select>
      </label>
      <div class="field-row">
        <label class="field"><span>计划日期</span><input id="taskDate" type="date" required></label>
        <label class="field"><span>优先级</span><select id="taskPriority"><option value="high">重要</option><option value="medium" selected>常规</option><option value="low">低优先</option></select></label>
      </div>
      <label class="field">
        <span>备注（可选）</span>
        <textarea id="taskNote" maxlength="240" rows="3" placeholder="记录目标、步骤或完成标准"></textarea>
      </label>
      <div class="modal-actions">
        <button class="button button-secondary" type="button" data-close-modal="taskModal">取消</button>
        <button class="button button-primary" type="submit">保存任务</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="dataModal">
    <div class="modal-card data-card">
      <div class="modal-header">
        <div><p class="eyebrow">BACKUP</p><h2>数据管理</h2></div>
        <button class="icon-button modal-close" type="button" data-close-modal="dataModal" aria-label="关闭">×</button>
      </div>
      <p class="modal-intro">任务存储在当前浏览器中。建议定期导出 JSON 文件备份，换设备时可重新导入。</p>
      <div class="data-options">
        <button class="data-option" id="exportButton">
          <span class="data-option-icon">↓</span>
          <span><strong>导出数据</strong><small>下载完整的 JSON 备份文件</small></span>
        </button>
        <button class="data-option" id="importButton">
          <span class="data-option-icon">↑</span>
          <span><strong>导入数据</strong><small>从 JSON 备份恢复任务</small></span>
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="data-danger">
        <div><strong>清空全部任务</strong><small>此操作不可撤销，建议先导出备份。</small></div>
        <button class="button button-danger" id="clearDataButton">清空</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
